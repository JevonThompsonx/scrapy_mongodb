# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: python · build
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          python3 -m pip install --quiet -r requirements.txt
      - name: compile
        run: python3 -m compileall -q $(ls -d */ 2>/dev/null | grep -v tests || echo .)
