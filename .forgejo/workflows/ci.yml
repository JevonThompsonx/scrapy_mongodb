# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: python · compile
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: compile check
        run: python -m compileall -q .
